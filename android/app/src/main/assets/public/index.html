<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>필름 카메라</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== 촬영 화면 ===== -->
<div class="screen on" id="camScreen">
  <div class="placeholder" id="placeholder">
    <div class="lens" aria-hidden="true"></div>
    <h1>필름 카메라<span class="dot">.</span></h1>
    <p>필름 룩으로 찍고, 세부 보정은 찍은 뒤에.<br />모든 처리는 내 기기 안에서만 이루어져요.</p>
    <button id="startBtn">카메라 켜기</button>
  </div>

  <!-- 상단 아이콘 바 -->
  <div class="topbar" id="camTop" style="display:none">
    <button class="ic" id="settingsBtn" title="보정">⚙</button>
    <button class="ic" id="flashBtn" title="플래시">⚡<sub id="flashTag">off</sub></button>
    <button class="ic" id="ssBtn" title="셔터스피드">⏱<sub id="ssTag">A</sub></button>
    <button class="ic" id="ratioBtn" title="화면 비율">▤<sub id="ratioTag">3:4</sub></button>
    <button class="ic" id="focalBtn" title="화각">◎<sub id="focalTag">28</sub></button>
    <button class="ic on" id="filmBtn" title="필름">✦<sub id="filmTag">1</sub></button>
    <button class="ic" id="wbBtn" title="화이트 밸런스">☀</button>
  </div>

  <div class="stagewrap"><div id="nativeCam"></div><canvas id="out"></canvas></div>
  <div class="status" id="status" style="display:none"><span class="led"></span><span id="statusText">얼굴 찾는 중…</span></div>
  <div id="focusRing" aria-hidden="true"></div>

  <!-- 하단 -->
  <div class="bottom" id="camBottom" style="display:none">
    <!-- 팝업 바 (아이콘 누르면 하나씩 열림) -->
    <div class="pop" id="skinBar">
      <div class="poprow">
        <span class="plabel">피부결</span>
        <div class="seg" id="skinSeg">
          <button class="pill" data-skin="0">끄기</button>
          <button class="pill" data-skin="30">기본</button>
          <button class="pill on" data-skin="60">자연스럽게</button>
          <button class="pill" data-skin="90">강하게</button>
        </div>
      </div>
      <div class="poprow">
        <span class="plabel">잡티</span>
        <input type="range" id="blemAmt" min="0" max="100" value="60" />
        <output class="sval" id="blemAmtVal">60</output>
      </div>
      <div class="poprow">
        <span class="plabel">눈 보정</span>
        <div class="seg"><button class="pill on" id="tgEye">켜짐</button></div>
      </div>
      <div class="poprow">
        <span class="plabel">카메라</span>
        <div class="seg"><button class="pill" id="tgCamMode">웹</button></div>
      </div>
      <div class="poprow">
        <span class="plabel">윤곽</span>
        <div class="seg"><button class="pill on" id="tgContour">켜짐</button></div>
      </div>
    </div>

    <div class="pop" id="ssBar">
      <div class="seg wide">
        <button class="pill on" data-ss="auto">오토</button>
        <button class="pill" data-ss="30">1/30</button>
        <button class="pill" data-ss="60">1/60</button>
        <button class="pill" data-ss="125">1/125</button>
        <button class="pill" data-ss="250">1/250</button>
      </div>
    </div>

    <div class="pop" id="ratioBar">
      <div class="seg wide">
        <button class="pill" data-ratio="1:1">1:1</button>
        <button class="pill on" data-ratio="3:4">3:4</button>
        <button class="pill" data-ratio="9:16">9:16</button>
      </div>
    </div>

    <div class="pop" id="focalBar">
      <div class="seg wide">
        <button class="pill on" data-focal="28">28mm</button>
        <button class="pill" data-focal="35">35mm</button>
        <button class="pill" data-focal="50">50mm</button>
      </div>
    </div>

    <div class="pop" id="filmBar">
      <div class="seg wide" id="filmPresets">
        <button class="pill on" data-fp="0">필름1</button>
        <button class="pill" data-fp="1">필름2</button>
        <button class="pill" data-fp="2">필름3</button>
        <button class="pill" data-fp="3">필름4</button>
      </div>
      <div class="poprow">
        <span class="plabel">세기</span>
        <input type="range" id="filmStrength" min="0" max="100" value="60" />
        <output class="sval" id="filmStrengthVal">60</output>
      </div>
    </div>

    <div class="pop" id="wbBar">
      <div class="seg wide">
        <button class="pill on" data-wbc="auto">오토</button>
        <button class="pill" data-wbc="5600">맑음</button>
        <button class="pill" data-wbc="4500">흐림</button>
        <button class="pill" data-wbc="3300">노을</button>
      </div>
    </div>

    <div class="shutterrow">
      <div class="side"><button class="ic round" id="flipBtn" title="카메라 전환">↺</button></div>
      <button id="shotBtn" disabled aria-label="사진 찍기"></button>
      <div class="side">
        <button class="thumb" id="galleryBtn" title="갤러리"><span id="thumbEmpty">▤</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 편집 화면 ===== -->
<div class="screen" id="editScreen">
  <div class="frame-wrap"><canvas class="frame" id="editOut"></canvas></div>
  <div class="edit-panel">
    <div class="diag" id="editDiag"></div>
    <div class="row"><label for="wrinkle">주름 완화</label><input type="range" id="wrinkle" min="0" max="100" value="50" /><output id="wrinkleVal">50</output></div>
    <div class="row"><label for="flash">플래시</label><input type="range" id="flash" min="0" max="100" value="0" /><output id="flashVal">0</output></div>
    <div class="row"><label for="film">필름 감성</label><input type="range" id="film" min="0" max="100" value="0" /><output id="filmVal">0</output></div>
    <div class="row"><label for="sharp">선명도</label><input type="range" id="sharp" min="0" max="100" value="15" /><output id="sharpVal">15</output></div>
    <div class="row"><label for="contrast">콘트라스트</label><input type="range" id="contrast" min="50" max="150" value="100" /><output id="contrastVal">100</output></div>
    <div class="row"><label for="sat">채도</label><input type="range" id="sat" min="0" max="200" value="100" /><output id="satVal">100</output></div>
    <div class="seg" role="group" aria-label="화이트 밸런스">
      <button class="seg-btn on" data-wb="auto">오토</button>
      <button class="seg-btn" data-wb="3300">3300K</button>
      <button class="seg-btn" data-wb="4400">4400K</button>
      <button class="seg-btn" data-wb="5600">5600K</button>
    </div>
    <div class="row"><label for="rGain">레드</label><input type="range" id="rGain" min="70" max="130" value="100" /><output id="rGainVal">100</output></div>
    <div class="row"><label for="gGain">그린</label><input type="range" id="gGain" min="70" max="130" value="100" /><output id="gGainVal">100</output></div>
    <div class="row"><label for="bGain">블루</label><input type="range" id="bGain" min="70" max="130" value="100" /><output id="bGainVal">100</output></div>
    <div class="edit-actions">
      <button id="retakeBtn">닫기</button>
      <button id="shareBtn">공유</button>
      <button id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- ===== 앱 내부 갤러리 ===== -->
<div class="screen" id="galleryScreen">
  <div class="gal-top">
    <button class="ic" id="galBack" title="돌아가기">←</button>
    <span class="gal-title">갤러리</span>
    <span class="gal-count" id="galCount"></span>
  </div>
  <div class="gal-grid" id="galGrid"></div>
  <div class="gal-empty" id="galEmpty">아직 찍은 사진이 없어요</div>
</div>

<div id="toast" role="status"></div>
<div id="screenFlash"></div>

<script type="module" src="app.js"></script>
</body>
</html>
